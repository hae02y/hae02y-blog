name: CI

# Deployment is handled by Vercel (auto-deploy on push).
# This workflow only runs type checks that Vercel does not perform.

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type check
        run: yarn run typecheck
